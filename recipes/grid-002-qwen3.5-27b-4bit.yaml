# ============================================================
# Grid-002 LoRA Fine-Tuning Recipe (Qwen3.5-27B, HF 4-bit QLoRA)
# ============================================================
# Fine-tune Qwen3.5-27B on the grid-002 isometric image
# cell-selection dataset (image + pixel boundary -> grid index).
#
# This recipe uses the HF backend with bitsandbytes NF4 4-bit loading.
# It is intentionally conservative for a first single-GPU attempt.
#
# Usage with train.sh:
#   sbatch --export=ALL,CONFIG_PATH=recipes/grid-002-qwen3.5-27b-4bit.yaml,RUN_NAME=grid_002_qwen3.5_27b_4bit_v1 train.sh
# ============================================================

# --- Model ---
model_name: Qwen/Qwen3.5-27B
backend: hf
load_in_4bit: true

# --- Dataset ---
dataset_path: dataset/grid-002/train_dataset.jsonl
dataset_dir: dataset/grid-002

# --- Run ---
run_name: grid_002_qwen3.5_27b_4bit

# --- LoRA ---
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
finetune_vision_layers: true
finetune_language_layers: true
finetune_attention_modules: true
finetune_mlp_modules: true

# --- Training ---
batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
num_epochs: 20
warmup_steps: 10
max_length: 384
lr_scheduler_type: linear
weight_decay: 0.01
seed: 3407

# --- Inference ---
inference_max_tokens: 4096
inference_temperature: 0.1
inference_min_p: 0.1
