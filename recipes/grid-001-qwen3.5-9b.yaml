# ============================================================
# Grid-001 LoRA Fine-Tuning Recipe (Qwen3.5-9B, HF)
# ============================================================
# Fine-tune Qwen3.5-9B on the grid-001 isometric image
# cell-selection dataset (image -> coordinates).
#
# Usage:
#   python src/train.py --config recipes/grid-001-qwen3.5-9b.yaml --run_name grid_001_qwen3.5_9b_v1
# ============================================================

# --- Model ---
model_name: Qwen/Qwen3.5-9B
backend: hf
load_in_4bit: true

# --- Dataset ---
dataset_path: dataset/grid-001/train_dataset.jsonl
dataset_dir: dataset/grid-001

# --- Run ---
run_name: grid_001_qwen3.5_9b

# --- LoRA ---
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
finetune_vision_layers: true
finetune_language_layers: true
finetune_attention_modules: true
finetune_mlp_modules: true

# --- Training ---
batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
num_epochs: 20
warmup_steps: 10
max_length: 512
lr_scheduler_type: linear
weight_decay: 0.01
seed: 3407

# --- Inference ---
inference_max_tokens: 4096
inference_temperature: 0.1
inference_min_p: 0.1
