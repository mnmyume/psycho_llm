# ============================================================
# Qwen3-VL-32B LoRA Fine-Tuning Recipe
# ============================================================
# Recipe for the larger 32B model on the full EmoArt-130k dataset.
# Requires more VRAM and training time.
#
# Usage:
#   python src/train.py --config recipes/Qwen3-VL-32B.yaml
# ============================================================

# --- Model ---
model_name: unsloth/Qwen3-VL-32B-Instruct-unsloth-bnb-4bit
load_in_4bit: true

# --- Dataset ---
dataset_path: dataset/EmoArt-130k/Annotation.json
dataset_dir: dataset/EmoArt-130k

# --- Run ---
run_name: qwen3_vl_32B_emoart_130k

# --- LoRA ---
lora_r: 16
lora_alpha: 16
lora_dropout: 0.0
finetune_vision_layers: true
finetune_language_layers: true
finetune_attention_modules: true
finetune_mlp_modules: true

# --- Training ---
batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
num_epochs: 1
warmup_steps: 5
max_length: 2048
lr_scheduler_type: linear
weight_decay: 0.001
seed: 3407

# --- Inference ---
inference_max_tokens: 4096
inference_temperature: 1.5
inference_min_p: 0.1
