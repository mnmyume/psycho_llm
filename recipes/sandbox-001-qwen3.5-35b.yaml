# ============================================================
# Sandbox-001 LoRA Fine-Tuning Recipe
# ============================================================
# Fine-tune Qwen3.5-35B-A3B on the sandbox-001 isometric image
# scoring dataset (chaos/tidy + monotony/variety, 1-5 scales).
#
# Usage:
#   python src/train.py --config recipes/sandbox-001-qwen3.5-35b.yaml --run_name sandbox_001_v1
# ============================================================

# --- Model ---
model_name: Qwen/Qwen3.5-35B-A3B
backend: hf
load_in_4bit: false  # 4-bit doesn't work for MoE models (BnB can't quantize expert layers)

# --- Dataset ---
dataset_path: dataset/sandbox-001/train_dataset.jsonl
dataset_dir: dataset/sandbox-001

# --- Run ---
run_name: sandbox_001

# --- LoRA ---
lora_r: 16
lora_alpha: 16
lora_dropout: 0.0
finetune_vision_layers: true
finetune_language_layers: true
finetune_attention_modules: true
finetune_mlp_modules: true

# --- Training ---
batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
num_epochs: 1
warmup_steps: 5
max_length: 2048
lr_scheduler_type: linear
weight_decay: 0.001
seed: 3407

# --- Inference ---
inference_max_tokens: 4096
inference_temperature: 1.5
inference_min_p: 0.1
